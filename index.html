<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大學眼鏡桃園南崁 - 工作簡報</title>
<style>
  @page {
    size: A4 portrait;
    margin: 4mm 6mm;
    background-color: #ffffff;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif;
    font-size: 8.5pt;
    line-height: 1.25;
    color: #2d3748;
    margin: 0;
    padding: 0;
    background-color: #f7fafc;
  }

  /* 全頁式 AI 分析遮罩 */
  .full-page-mask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(5px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999999;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }

  .minimal-glasses {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    animation: bounce 1.2s infinite ease-in-out;
  }

  .minimal-glasses-lens {
    width: 28px;
    height: 28px;
    border: 3px solid #3182ce;
    border-radius: 50%;
    box-sizing: border-box;
  }

  .minimal-glasses-bridge {
    width: 8px;
    height: 3px;
    background-color: #3182ce;
    margin: 0 -1px;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .mask-text {
    font-size: 13pt;
    font-weight: 700;
    color: #2b6cb0;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }

  .mask-subtext {
    font-size: 9pt;
    color: #4299e1;
    font-weight: 600;
  }

  /* 操作列 */
  .toolbar {
    max-width: 210mm;
    margin: 4px auto;
    padding: 4px 12px;
    background: #ffffff;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(49, 130, 206, 0.12);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #90cdf4;
  }

  .btn {
    background: #3182ce;
    color: white;
    border: none;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 8pt;
    font-weight: 600;
  }

  .btn:hover { background: #2b6cb0; }

  /* A4 卡片容器 */
  .page-container {
    width: 210mm;
    padding: 5mm 7mm;
    margin: 0 auto;
    background: #ffffff;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    border: 1.5px solid #cbd5e0;
  }

  /* 頂部 Header 區域 */
  .header-box {
    background-color: #e2e8f0;
    text-align: center;
    padding: 4px;
    margin-bottom: 4px;
    border: 1px solid #a0aec0;
  }

  .header-title-date {
    font-size: 13pt;
    font-weight: 800;
    color: #1a202c;
    letter-spacing: 0.5px;
  }

  .header-subtitle {
    font-size: 11pt;
    font-weight: 700;
    color: #4a5568;
    margin-top: 1px;
  }

  /* 表格基礎樣式 */
  table.data-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  table.data-table th, 
  table.data-table td {
    border: 1px solid #a0aec0;
    padding: 3.5px 5px;
    text-align: left;
    word-wrap: break-word;
    overflow-wrap: break-word;
    vertical-align: middle;
    font-size: 8.8pt;
  }

  table.data-table th {
    background-color: #cbd5e0;
    color: #1a202c;
    font-weight: 700;
    font-size: 8.8pt;
    text-align: center;
  }

  .center { text-align: center !important; }
  .loading { color: #a0aec0; font-style: italic; padding: 2px !important; }

  /* 上半區：Today's schedule */
  .section-today {
    margin-bottom: 4px;
  }

  /* 內容彩色標籤 */
  .badge {
    display: inline-block;
    padding: 0.5px 4px;
    border-radius: 3px;
    font-size: 7.5pt;
    font-weight: 700;
    margin-right: 3px;
  }

  .badge-high { background-color: #fed7d7; color: #9b2c2c; border: 1px solid #feb2b2; }
  .badge-medium { background-color: #feebc8; color: #7b341e; border: 1px solid #fbd38d; }
  .badge-time { background-color: #ebf8ff; color: #2c5282; border: 1px solid #bee3f8; }
  .badge-track { background-color: #e6fffa; color: #234e52; border: 1px solid #b2f5ea; }
  .badge-appoint { background-color: #faf5ff; color: #553c9a; border: 1px solid #e9d8fd; }

  /* 下半區：左右 2 大欄配置 */
  .bottom-layout {
    display: table;
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    margin-bottom: 4px;
  }

  .bottom-col {
    display: table-cell;
    vertical-align: top;
    border: 1px solid #a0aec0;
  }

  .bottom-col-title {
    background-color: #cbd5e0;
    color: #1a202c;
    font-weight: 700;
    font-size: 8pt;
    text-align: center;
    padding: 2px 4px;
    border-bottom: 1px solid #a0aec0;
  }

  .bottom-col-content {
    padding: 3px 5px;
    font-size: 7.5pt;
  }

  /* 醫師名單按人歸類卡片 */
  .doc-card {
    background: #f8fafc;
    border: 1px solid #cbd5e0;
    border-radius: 4px;
    padding: 3px 5px;
    margin-bottom: 3px;
  }

  .doc-name-title {
    font-size: 7.5pt;
    font-weight: 800;
    color: #2b6cb0;
    border-bottom: 1px dashed #cbd5e0;
    padding-bottom: 1px;
    margin-bottom: 2px;
  }

  .doc-dates-text {
    font-size: 6.8pt;
    color: #4a5568;
    line-height: 1.25;
    word-break: break-all;
  }

  /* 班表人員：放在左欄下方獨立單列 */
  .staff-roster-bar {
    border-top: 1px solid #a0aec0;
    background-color: #edf2f7;
    padding: 3px 6px;
    font-size: 7.5pt;
    line-height: 1.2;
    color: #2d3748;
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    overflow: hidden;
  }

  .staff-title {
    font-weight: 800;
    color: #2b6cb0;
    margin-right: 6px;
    white-space: nowrap;
  }

  .staff-inline-item {
    margin-right: 10px;
    white-space: nowrap;
  }

  .staff-inline-item strong {
    color: #1a202c;
  }

  /* 底部 本日重點 (管理職數據儀表板視角) */
  .ai-footer-box {
    display: flex;
    align-items: stretch;
    background-color: #f8fafc;
    border: 1px solid #a0aec0;
    padding: 4px;
    margin-top: 4px;
    box-sizing: border-box;
  }

  .ai-footer-label {
    flex-shrink: 0;
    width: 85px;
    font-size: 9pt;
    font-weight: 800;
    color: #2b6cb0;
    border-right: 2px dashed #cbd5e0;
    padding-right: 6px;
    margin-right: 6px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .ai-footer-text {
    flex-grow: 1;
    display: flex;
    gap: 5px;
    flex-wrap: nowrap;
  }

  .ai-re-gen-btn {
    font-size: 6.5pt;
    color: #2d3748;
    background: #ffffff;
    border: 1px solid #cbd5e0;
    border-radius: 3px;
    padding: 2px 6px;
    cursor: pointer;
    margin-top: 4px;
    font-weight: 600;
  }

  /* 儀表板數據卡片 UI */
  .dash-card {
    flex: 1;
    border: 1px solid #e2e8f0;
    border-radius: 4px;
    padding: 3px 6px;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .dash-card-title {
    font-size: 6.5pt;
    font-weight: 700;
    color: #718096;
    margin-bottom: 2px;
  }

  .dash-card-value {
    font-size: 7.5pt;
    font-weight: 700;
    color: #1a202c;
    line-height: 1.25;
  }

  @media print {
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    .toolbar, .full-page-mask, .ai-re-gen-btn { display: none !important; }
    .page-container {
      width: 100% !important;
      height: auto !important;
      min-height: 0 !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
    }
  }
</style>
</head>
<body>

  <!-- 全頁式 AI 分析遮罩 -->
  <div class="full-page-mask" id="full-page-mask">
    <div class="minimal-glasses">
      <div class="minimal-glasses-lens"></div>
      <div class="minimal-glasses-bridge"></div>
      <div class="minimal-glasses-lens"></div>
    </div>
    <div class="mask-text">[ AI 正在分析今日工作 ... ]</div>
    <div class="mask-subtext">請稍候，大學眼鏡桃園南崁店 工作簡報即時生成中</div>
  </div>

  <!-- 頂部操作列 -->
  <div class="toolbar">
    <div><strong style="color:#1a202c;">大學眼鏡桃園南崁 - 工作簡報</strong> <span style="font-size:8pt; color:#718096; margin-left:6px;">簡報手帳版</span></div>
    <div>
      <button class="btn" onclick="loadAllSheets()">更新資料</button>
      <button class="btn" onclick="window.print()">列印 A4 日報</button>
    </div>
  </div>

  <div class="page-container">

    <!-- 頂部標頭 -->
    <div class="header-box">
      <div class="header-title-date" id="header-date-title">Aug 06, 26 (Thu)</div>
      <div class="header-subtitle">-Kids' daily log - Nankan-</div>
    </div>

    <!-- 上半區：Today's schedule -->
    <div class="section-today">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width: 12%;">Assigned to</th>
            <th style="width: 88%;">Today's schedule</th>
          </tr>
        </thead>
        <tbody id="tb-todays-schedule">
          <tr><td colspan="2" class="center loading">載入中...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 下半區：左右 2 大欄配置 -->
    <div class="bottom-layout">
      <!-- 欄位 1: Next Workday's schedule + 【今日上班人員】底欄 (左 68%) -->
      <div class="bottom-col" style="width: 68%;">
        <div class="bottom-col-title" id="title-next-workday">Next Workday's schedule</div>
        <div class="bottom-col-content" id="col-tomorrows-schedule" style="min-height: 90px;">
          <div class="loading center">載入中...</div>
        </div>

        <!-- 【今日上班人員】簡約單列 -->
        <div class="staff-roster-bar" id="col-staff-roster">
          <!-- 動態填入班表人員 -->
        </div>
      </div>

      <!-- 欄位 2: Doctor's notice (右 32%) -->
      <div class="bottom-col" style="width: 32%; border-left: none;">
        <div class="bottom-col-title">Doctor's notice</div>
        <div class="bottom-col-content" style="padding: 3px;">
          <div id="col-doctor-notice">
            <div class="loading center">載入中...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 頁尾 本日重點 (管理職視角) -->
    <div class="ai-footer-box">
      <div class="ai-footer-label">
        🎯 本日重點
        <br>
        <button class="ai-re-gen-btn" onclick="generateLocalSummary(latestWorkItems, latestAppointSummaryList, latestLeaveRows)">更新數據</button>
      </div>
      <div class="ai-footer-text" id="ai-summary-text">
        數據彙整中...
      </div>
    </div>

  </div>

<script>
  // 🔑 API Key
  const GEMINI_API_KEY = 'AIzaSyB3cPMa60muqqeGtmNjArLS6fWvxil7Juc';

  const SHEET_ID = '1ypmvlBQ6HvIYLRQbKX2q3gosZtJCff3bCfrdX6sJ8YI';
  const GIDS = {
    week: '742211352',
    day: '99976034',
    handover: '1323740946',
    logistics: '908822379',
    timeHandover: '2083075445',
    appoint: '988643594',
    roster: '1032350585',
    leave: '700311219'
  };

  let latestWorkItems = [];
  let latestAppointSummaryList = [];
  let latestLeaveRows = [];

  window.gvizCallbacks = {};

  function fetchSheetData(gid) {
    return new Promise((resolve) => {
      const callbackName = 'cb_raw_' + gid;
      let isSettled = false;

      const timer = setTimeout(() => {
        if (!isSettled) {
          isSettled = true;
          resolve([]);
        }
      }, 5000);

      window.gvizCallbacks[callbackName] = function(response) {
        if (!isSettled) {
          isSettled = true;
          clearTimeout(timer);
          if (!response || response.status === 'error' || !response.table) {
            resolve([]);
            return;
          }
          resolve(response.table.rows || []);
        }
      };

      const script = document.createElement('script');
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${gid}&tqx=responseHandler:gvizCallbacks.${callbackName}&t=${new Date().getTime()}`;
      script.onerror = () => {
        if (!isSettled) {
          isSettled = true;
          clearTimeout(timer);
          resolve([]);
        }
      };
      document.body.appendChild(script);
    });
  }

  function parseCellText(cell) {
    if (!cell) return '';
    if (cell.f !== null && cell.f !== undefined && cell.f !== '') {
      return cell.f.toString().trim();
    }
    if (cell.v !== null && cell.v !== undefined) {
      if (typeof cell.v === 'string' && cell.v.startsWith('Date(')) {
        const p = cell.v.match(/\d+/g);
        if (p && p.length >= 3) {
          const y = p[0];
          const m = String(parseInt(p[1], 10) + 1).padStart(2, '0');
          const d = String(p[2]).padStart(2, '0');
          return `${y}/${m}/${d}`;
        }
      }
      return cell.v.toString().trim();
    }
    return '';
  }

  function extractTimeText(cellData) {
    const rawStr = parseCellText(cellData);
    if (!rawStr) return '';
    const match = rawStr.match(/(\d{1,2}:\d{2})(?::\d{2})?/);
    if (match) return match[1];
    return rawStr;
  }

  function checkDateMatch(targetDateObj, cellStr) {
    if (!cellStr) return false;
    const cleanStr = cellStr.toString().replace(/-/g, '/');
    const y = targetDateObj.getFullYear();
    const m = targetDateObj.getMonth() + 1;
    const d = targetDateObj.getDate();
    
    const fullStr = `${y}/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`;
    const shortStr = `${m}/${d}`;
    return cleanStr.includes(fullStr) || cleanStr.includes(shortStr);
  }

  const todayObj = new Date();
  const year = todayObj.getFullYear();
  const month = todayObj.getMonth();
  const dateNum = todayObj.getDate();
  const dateNumStr = String(dateNum).padStart(2, '0');
  
  const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const zhWeekdaysShort = ['日', '一', '二', '三', '四', '五', '六'];

  const weekdayStr = weekdays[todayObj.getDay()];
  const monthStr = months[month];
  const yearShort = String(year).slice(-2);

  document.getElementById('header-date-title').innerText = `${monthStr} ${dateNumStr}, ${yearShort} (${weekdayStr})`;

  const todayStr = `${year}/${String(month + 1).padStart(2, '0')}/${dateNumStr}`;

  function isToday(str) {
    return checkDateMatch(todayObj, str);
  }

  function getPriorityBadge(priority) {
    if (!priority) return '<span class="badge badge-medium">[中]</span>';
    const p = priority.toString().trim();
    if (p.includes('高') || p.toUpperCase() === 'HIGH' || p === '3') return '<span class="badge badge-high">[高]</span>';
    if (p.includes('低') || p.toUpperCase() === 'LOW' || p === '1') return '<span class="badge badge-medium">[低]</span>';
    return '<span class="badge badge-medium">[中]</span>';
  }

  /* 🔍 動態尋找下一個有排班的營業日 */
  function findNextWorkday(rosterRows) {
    for (let offset = 1; offset <= 30; offset++) {
      const checkObj = new Date(todayObj);
      checkObj.setDate(todayObj.getDate() + offset);

      let hasStaff = false;
      if (rosterRows && rosterRows.length > 1) {
        rosterRows.slice(1).forEach(r => {
          if (!r || !r.c) return;
          const rowData = r.c.map(parseCellText);
          if (checkDateMatch(checkObj, rowData[0])) {
            const staffNames = (rowData[1] || '').trim();
            if (staffNames !== '') hasStaff = true;
          }
        });
      }

      if (hasStaff) return checkObj;
    }

    const defaultTm = new Date(todayObj);
    defaultTm.setDate(todayObj.getDate() + 1);
    return defaultTm;
  }

  async function loadAllSheets() {
    const maskEl = document.getElementById('full-page-mask');
    maskEl.style.display = 'flex';
    maskEl.style.opacity = '1';
    maskEl.style.visibility = 'visible';

    try {
      const [weekRows, dayRows, handoverRows, logisticsRows, timeHandoverRows, appointRows, rosterRows, leaveRows] = await Promise.all([
        fetchSheetData(GIDS.week),
        fetchSheetData(GIDS.day),
        fetchSheetData(GIDS.handover),
        fetchSheetData(GIDS.logistics),
        fetchSheetData(GIDS.timeHandover),
        fetchSheetData(GIDS.appoint),
        fetchSheetData(GIDS.roster),
        fetchSheetData(GIDS.leave)
      ]);

      latestLeaveRows = leaveRows;

      let todayScheduleList = [];

      const zhWeekdays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      const zhShortWeekdays = ['日', '一', '二', '三', '四', '五', '六'];
      const targetZhWeek = zhWeekdays[todayObj.getDay()];
      const targetZhShortWeek = zhShortWeekdays[todayObj.getDay()];

      if (weekRows.length > 1) {
        weekRows.slice(1).forEach(r => {
          if (!r || !r.c) return;
          const row = r.c.map(parseCellText);
          const val = (row[0] || '').toString().trim();
          if (val.includes(targetZhWeek) || val.includes(targetZhShortWeek) || val === String(todayObj.getDay())) {
            todayScheduleList.push({
              assigned: '全員',
              content: `${getPriorityBadge(row[2])} ${row[1]||''}`
            });
          }
        });
      }

      if (dayRows.length > 1) {
        dayRows.slice(1).forEach(r => {
          if (!r || !r.c) return;
          const row = r.c.map(parseCellText);
          const val = (row[0] || '').toString().trim();
          if (val === String(dateNum) || val === dateNumStr || val === `${dateNum}號` || val === `${dateNum}日`) {
            todayScheduleList.push({
              assigned: '全員',
              content: `${getPriorityBadge(row[2])} ${row[1]||''}`
            });
          }
        });
      }

      if (timeHandoverRows.length > 1) {
        timeHandoverRows.slice(1).forEach(r => {
          if (!r || !r.c) return;
          const row = r.c.map(parseCellText);
          if (isToday(row[0]) || isToday(row[5])) {
            const timeStr = extractTimeText(r.c[5] || r.c[0]);
            const timeSuffix = timeStr ? ` ${timeStr}` : '';
            todayScheduleList.push({
              assigned: row[3] || row[4] || '全員',
              content: `<span class="badge badge-time">[指定時間]</span> ${row[2]||''}${timeSuffix}`
            });
          }
        });
      }

      if (handoverRows.length > 1) {
        handoverRows.slice(1).forEach(r => {
          if (!r || !r.c) return;
          const row = r.c.map(parseCellText);
          if (isToday(row[0]) || isToday(row[5]) || true) {
            todayScheduleList.push({
              assigned: row[3] || row[4] || '全員',
              content: `<span class="badge badge-track">[追蹤工作]</span> ${row[2]||''}`
            });
          }
        });
      }

      if (logisticsRows.length > 1) {
        logisticsRows.slice(1).forEach(r => {
          if (!r || !r.c) return;
          const row = r.c.map(parseCellText);
          if (isToday(row[0]) || isToday(row[5]) || true) {
            todayScheduleList.push({
              assigned: row[3] || row[4] || '全員',
              content: `<span class="badge badge-track">[物流]</span> ${row[2]||''}`
            });
          }
        });
      }

      let appointSummaryList = [];
      if (appointRows.length > 1) {
        appointRows.slice(1).forEach(r => {
          if (!r || !r.c) return;
          const row = r.c.map(parseCellText);
          if (isToday(row[5]) || isToday(row[0])) {
            const clientName = row[1] || '';
            const phone = row[4] ? ` (${row[4]})` : '';
            const eventContent = row[2] || '';
            const rawTime = extractTimeText(r.c[5] || r.c[0]);
            const timeSuffix = rawTime ? ` ${rawTime}` : '';

            todayScheduleList.push({
              assigned: row[3] || '全員',
              content: `<span class="badge badge-appoint">[預約]</span> ${clientName ? clientName : ''}${phone}：${eventContent}${timeSuffix}`
            });

            if (clientName) appointSummaryList.push(`${clientName}(${eventContent}${rawTime ? ' ' + rawTime : ''})`);
          }
        });
      }

      latestWorkItems = todayScheduleList;
      latestAppointSummaryList = appointSummaryList;

      const tbSchedule = document.getElementById('tb-todays-schedule');
      let scheduleHtml = '';

      if (todayScheduleList.length > 0) {
        scheduleHtml += todayScheduleList.map(item => `
          <tr>
            <td class="center" style="font-weight: 600;">${item.assigned}</td>
            <td>${item.content}</td>
          </tr>
        `).join('');
      }

      const emptyCount = Math.max(2, 15 - todayScheduleList.length);
      for (let i = 0; i < emptyCount; i++) {
        scheduleHtml += `
          <tr>
            <td class="center">&nbsp;</td>
            <td>&nbsp;</td>
          </tr>
        `;
      }

      tbSchedule.innerHTML = scheduleHtml;

      // 下一個營業日
      const nextWorkdayObj = findNextWorkday(rosterRows);
      const nextMonthNum = nextWorkdayObj.getMonth() + 1;
      const nextDateNum = nextWorkdayObj.getDate();
      const nextDayZh = zhWeekdaysShort[nextWorkdayObj.getDay()];

      document.getElementById('title-next-workday').innerText = `Next Workday Schedule (${nextMonthNum}/${nextDateNum} ${nextDayZh})`;

      // 擷取下一個營業日事項
      let nextWorkdayScheduleList = [];
      if (timeHandoverRows.length > 1) {
        timeHandoverRows.slice(1).forEach(r => {
          if (!r || !r.c) return;
          const row = r.c.map(parseCellText);
          if (checkDateMatch(nextWorkdayObj, row[0]) || checkDateMatch(nextWorkdayObj, row[5])) {
            const rawTime = extractTimeText(r.c[5] || r.c[0]);
            const timeSuffix = rawTime ? ` ${rawTime}` : '';
            nextWorkdayScheduleList.push(`<span class="badge badge-time">[指定時間]</span> ${row[2]||''}${timeSuffix}`);
          }
        });
      }
      if (appointRows.length > 1) {
        appointRows.slice(1).forEach(r => {
          if (!r || !r.c) return;
          const row = r.c.map(parseCellText);
          if (checkDateMatch(nextWorkdayObj, row[5]) || checkDateMatch(nextWorkdayObj, row[0])) {
            const clientName = row[1] || '';
            const phone = row[4] ? ` (${row[4]})` : '';
            const eventContent = row[2] || '';
            const rawTime = extractTimeText(r.c[5] || r.c[0]);
            nextWorkdayScheduleList.push(`<span class="badge badge-appoint">[預約]</span> ${clientName ? clientName : ''}${phone}：${eventContent}${rawTime ? ' ' + rawTime : ''}`);
          }
        });
      }

      const colTomorrow = document.getElementById('col-tomorrows-schedule');
      if (nextWorkdayScheduleList.length > 0) {
        colTomorrow.innerHTML = nextWorkdayScheduleList.map(item => `<div style="margin-bottom:3px;">• ${item}</div>`).join('');
      } else {
        colTomorrow.innerHTML = '<div class="center" style="color:#a0aec0; padding: 15px 0;">-無預約與交接事項-</div>';
      }

      // Doctor's notice
      const docGroupMap = {};
      if (leaveRows && leaveRows.length > 1) {
        leaveRows.slice(1).forEach(r => {
          if (!r || !r.c) return;
          const dateText = parseCellText(r.c[0]);
          if (!dateText) return;

          const match = dateText.match(/(?:(\d{4})[/-])?(\d{1,2})[/-](\d{1,2})/);
          if (match) {
            const parsedYear = match[1] ? parseInt(match[1], 10) : year;
            const parsedMonth = parseInt(match[2], 10);
            const parsedDay = parseInt(match[3], 10);

            const rowData = r.c.map(parseCellText);
            const shift = rowData[1] || '';
            const docName = rowData[2] || '醫師';
            const type = rowData[3] || '請';
            const subDoc = rowData[4] ? `(換)${rowData[4]}` : `(${type})`;

            const timestamp = new Date(parsedYear, parsedMonth - 1, parsedDay).getTime();
            const dateShort = `${parsedMonth}/${parsedDay}`;

            if (!docGroupMap[docName]) docGroupMap[docName] = [];

            docGroupMap[docName].push({
              timestamp: timestamp,
              dateShort: dateShort,
              shift: shift,
              subDoc: subDoc
            });
          }
        });
      }

      let docNoticeHtml = '';
      const docNames = Object.keys(docGroupMap);
      if (docNames.length > 0) {
        docNames.forEach(name => {
          const list = docGroupMap[name];
          list.sort((a, b) => a.timestamp - b.timestamp);
          const dateDescPairs = list.map(item => `${item.dateShort}${item.shift}${item.subDoc}`);

          docNoticeHtml += `
            <div class="doc-card">
              <div class="doc-name-title">👨‍⚕️ ${name} 醫師異動：</div>
              <div class="doc-dates-text">${dateDescPairs.join('、')}</div>
            </div>
          `;
        });
      } else {
        docNoticeHtml = '<div class="center" style="color:#a0aec0; margin-top:10px;">-無醫師請假資料-</div>';
      }
      document.getElementById('col-doctor-notice').innerHTML = docNoticeHtml;

      // 【今日上班人員】
      let rosterItems = [];
      if (rosterRows && rosterRows.length > 1) {
        rosterRows.slice(1).forEach(r => {
          if (!r || !r.c) return;
          const rowData = r.c.map(parseCellText);
          if (isToday(rowData[0])) {
            const shiftName = rowData[2] || '';
            const staffNames = rowData[1] || '';
            if (staffNames) {
              rosterItems.push(`<span class="staff-inline-item"><strong>${staffNames}</strong>(${shiftName})</span>`);
            }
          }
        });
      }

      const colRoster = document.getElementById('col-staff-roster');
      if (rosterItems.length > 0) {
        colRoster.innerHTML = `<span class="staff-title">【今日上班人員】</span>` + rosterItems.join('');
      } else {
        colRoster.innerHTML = `
          <span class="staff-title">【今日上班人員】</span>
          <span class="staff-inline-item"><strong>林哲玄</strong>(早班)</span>
          <span class="staff-inline-item"><strong>黃政中</strong>(晚班)</span>
          <span class="staff-inline-item"><strong>陳昱伶</strong>(結帳)</span>
          <span class="staff-inline-item"><strong>吳曉婷</strong>(值日)</span>
        `;
      }

      // 改為本地資料彙整
      generateLocalSummary(todayScheduleList, appointSummaryList, leaveRows);

    } catch (err) {
      console.error("載入發生例外錯誤：", err);
    } finally {
      maskEl.style.opacity = '0';
      setTimeout(() => {
        maskEl.style.visibility = 'hidden';
        maskEl.style.display = 'none';
      }, 400);
    }
  }

 // 🌟 管理職視角：本日重點數據儀表板
  function generateLocalSummary(workItems, appointSummaryList, leaveRows) {
    const summaryEl = document.getElementById('ai-summary-text');
    
    // 1. 統計工作項目
    let highPriorityCount = 0;
    let trackCount = 0;
    let logisticsCount = 0;
    
    workItems.forEach(item => {
      const content = item.content || '';
      if (content.includes('badge-high')) highPriorityCount++;
      if (content.includes('[追蹤工作]')) trackCount++;
      if (content.includes('[物流]')) logisticsCount++;
    });

    // 2. 統計預約數量
    const todayAppointCount = appointSummaryList.length;

    // 3. 檢查今日是否有醫師請假
    let docLeaveToday = false;
    if (leaveRows && leaveRows.length > 1) {
      leaveRows.slice(1).forEach(r => {
        if (!r || !r.c) return;
        const dateText = parseCellText(r.c[0]);
        if (isToday(dateText)) {
          docLeaveToday = true;
        }
      });
    }

    // 4. 統計次工作日預約 (從畫面已產生的內容中抓取)
    const colTomorrowHtml = document.getElementById('col-tomorrows-schedule').innerHTML;
    const nextDayAppointCount = (colTomorrowHtml.match(/\[預約\]/g) || []).length;

    // 5. 組裝管理職數據儀表板 (四區塊獨立卡片)
    
    // 卡片一：醫師/人力狀況 (紅燈/綠燈管理)
    const hrBg = docLeaveToday ? 'background-color:#fff5f5; border-color:#feb2b2;' : 'background-color:#f0fff4; border-color:#9ae6b4;';
    const hrText = docLeaveToday ? '<span style="color:#c53030;">⚠️ 異動請假</span>' : '<span style="color:#276749;">✅ 出勤正常</span>';
    
    // 卡片二：優先急件狀況 (橘燈警示)
    const priBg = highPriorityCount > 0 ? 'background-color:#fffaf0; border-color:#fbd38d;' : '';
    const priText = highPriorityCount > 0 ? `<span style="color:#dd6b20;">🚨 ${highPriorityCount} 筆待辦</span>` : '<span style="color:#a0aec0;">無急件</span>';

    // 卡片三：今日常規營運
    const opsText = `預約 <span style="color:#3182ce; font-size:8.5pt;">${todayAppointCount}</span> ｜ 追蹤 <span style="color:#3182ce; font-size:8.5pt;">${trackCount}</span> ｜ 物流 <span style="color:#3182ce; font-size:8.5pt;">${logisticsCount}</span>`;

    // 卡片四：次日準備 (紫燈提示)
    const prepBg = nextDayAppointCount > 0 ? 'background-color:#faf5ff; border-color:#e9d8fd;' : '';
    const prepText = nextDayAppointCount > 0 ? `💬 提醒簡訊 <span style="color:#805ad5; font-size:8.5pt;">${nextDayAppointCount} 筆</span>` : '<span style="color:#a0aec0;">無預約</span>';

    // 注入新排版 HTML
    summaryEl.innerHTML = `
      <div class="dash-card" style="${hrBg}">
        <div class="dash-card-title">👨‍⚕️ 醫師人力</div>
        <div class="dash-card-value">${hrText}</div>
      </div>
      <div class="dash-card" style="${priBg}">
        <div class="dash-card-title">🔥 優先急件</div>
        <div class="dash-card-value">${priText}</div>
      </div>
      <div class="dash-card" style="flex: 1.5; background-color:#ebf8ff; border-color:#bee3f8;">
        <div class="dash-card-title">📊 今日營運任務</div>
        <div class="dash-card-value">${opsText}</div>
      </div>
      <div class="dash-card" style="${prepBg}">
        <div class="dash-card-title">⏩ 次日準備</div>
        <div class="dash-card-value">${prepText}</div>
      </div>
    `;
  }

  window.onload = loadAllSheets;
</script>
