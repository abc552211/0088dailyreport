<!DOCTYPE html>
<html lang="zh-TW">


<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>大學眼鏡桃園南崁 - 工作簡報</title>
<style>
  @page {
    size: A4 portrait;
    margin: 4mm 6mm;
    background-color: #ffffff;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif;
    font-size: 8.5pt;
    line-height: 1.25;
    color: #2d3748;
    margin: 0;
    padding: 0;
    background-color: #f7fafc;
  }

  /* 全頁式 AI 分析遮罩 */
  .full-page-mask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(5px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999999;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }

  .minimal-glasses {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    animation: bounce 1.2s infinite ease-in-out;
  }

  .minimal-glasses-lens {
    width: 28px;
    height: 28px;
    border: 3px solid #3182ce;
    border-radius: 50%;
    box-sizing: border-box;
  }

  .minimal-glasses-bridge {
    width: 8px;
    height: 3px;
    background-color: #3182ce;
    margin: 0 -1px;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .mask-text {
    font-size: 13pt;
    font-weight: 700;
    color: #2b6cb0;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }

  .mask-subtext {
    font-size: 9pt;
    color: #4299e1;
    font-weight: 600;
  }

  /* 操作列 */
  .toolbar {
    max-width: 210mm;
    margin: 4px auto;
    padding: 4px 12px;
    background: #ffffff;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(49, 130, 206, 0.12);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #90cdf4;
  }

  .btn {
    background: #3182ce;
    color: white;
    border: none;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 8pt;
    font-weight: 600;
  }

  .btn:hover { background: #2b6cb0; }

  /* A4 卡片容器 */
  .page-container {
    width: 210mm;
    padding: 5mm 7mm;
    margin: 0 auto;
    background: #ffffff;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    border: 1.5px solid #cbd5e0;
  }

  /* 頂部 Header 區域 */
  .header-box {
    background-color: #e2e8f0;
    text-align: center;
    padding: 4px;
    margin-bottom: 4px;
    border: 1px solid #a0aec0;
  }

  .header-title-date {
    font-size: 13pt;
    font-weight: 800;
    color: #1a202c;
    letter-spacing: 0.5px;
  }

  .header-subtitle {
    font-size: 11pt;
    font-weight: 700;
    color: #4a5568;
    margin-top: 1px;
  }

  /* 表格基礎樣式 */
  table.data-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  table.data-table th, 
  table.data-table td {
    border: 1px solid #a0aec0;
    padding: 3.5px 5px;
    text-align: left;
    word-wrap: break-word;
    overflow-wrap: break-word;
    vertical-align: middle;
    font-size: 8.8pt;
  }

  table.data-table th {
    background-color: #cbd5e0;
    color: #1a202c;
    font-weight: 700;
    font-size: 8.8pt;
    text-align: center;
  }

  .center { text-align: center !important; }
  .loading { color: #a0aec0; font-style: italic; padding: 2px !important; }

  /* 上半區：Today's schedule */
  .section-today {
    margin-bottom: 4px;
  }

  /* 內容彩色標籤 */
  .badge {
    display: inline-block;
    padding: 0.5px 4px;
    border-radius: 3px;
    font-size: 7.5pt;
    font-weight: 700;
    margin-right: 3px;
  }

  .badge-high { background-color: #fed7d7; color: #9b2c2c; border: 1px solid #feb2b2; }
  .badge-medium { background-color: #feebc8; color: #7b341e; border: 1px solid #fbd38d; }
  .badge-time { background-color: #ebf8ff; color: #2c5282; border: 1px solid #bee3f8; }
  .badge-track { background-color: #e6fffa; color: #234e52; border: 1px solid #b2f5ea; }
  .badge-appoint { background-color: #faf5ff; color: #553c9a; border: 1px solid #e9d8fd; }
  .badge-doc { background-color: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
  .badge-limited { background-color: #efe8f4; color: #6d597a; border: 1px solid #d6c7df; }
  .badge-limited-end { background-color: #f3e8ff; color: #702459; border: 1px solid #d8b4fe; }

  /* 下半區：左右 2 大欄配置 (調整為各 50% 均衡分配) */
  .bottom-layout {
    display: table;
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    margin-bottom: 4px;
  }

  .bottom-col {
    display: table-cell;
    vertical-align: top;
    border: 1px solid #a0aec0;
  }

  .bottom-col-title {
    background-color: #cbd5e0;
    color: #1a202c;
    font-weight: 700;
    font-size: 8pt;
    text-align: center;
    padding: 2px 4px;
    border-bottom: 1px solid #a0aec0;
  }

  .bottom-col-content {
    padding: 3px 5px;
    font-size: 7.5pt;
  }

  /* 醫師名單按人歸類卡片 */
  .doc-card {
    background: #f8fafc;
    border: 1px solid #cbd5e0;
    border-radius: 4px;
    padding: 3px 5px;
    margin-bottom: 3px;
  }

  .doc-name-title {
    font-size: 7.5pt;
    font-weight: 800;
    color: #2b6cb0;
    border-bottom: 1px dashed #cbd5e0;
    padding-bottom: 1px;
    margin-bottom: 2px;
  }

  /* 雙排佈局容器：自動依內容長度分雙欄顯示 */
  .doc-dates-text-grid {
    column-count: 2;
    column-gap: 6px;
    font-size: 6.8pt;
    color: #4a5568;
    line-height: 1.25;
  }

  .doc-date-group {
    break-inside: avoid;
    margin-bottom: 2px;
    font-size: 6.8pt;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .doc-date-tag {
    font-weight: 700;
    color: #2d3748;
    margin-right: 2px;
  }

  /* 班表人員：放在左欄下方獨立單列 */
  .staff-roster-bar {
    border-top: 1px solid #a0aec0;
    background-color: #edf2f7;
    padding: 3px 6px;
    font-size: 7.5pt;
    line-height: 1.2;
    color: #2d3748;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 8px;
  }

  .staff-title {
    font-weight: 800;
    color: #2b6cb0;
    margin-right: 4px;
    white-space: nowrap;
  }

  .staff-inline-item {
    white-space: nowrap;
  }

  .staff-inline-item strong {
    color: #1a202c;
  }

  /* 底部 本日重點 (管理職數據儀表板視角) */
  .ai-footer-box {
    display: flex;
    align-items: stretch;
    background-color: #f8fafc;
    border: 1px solid #a0aec0;
    padding: 4px;
    margin-top: 4px;
    box-sizing: border-box;
  }

  .ai-footer-label {
    flex-shrink: 0;
    width: 85px;
    font-size: 9pt;
    font-weight: 800;
    color: #2b6cb0;
    border-right: 2px dashed #cbd5e0;
    padding-right: 6px;
    margin-right: 6px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .ai-footer-text {
    flex-grow: 1;
    display: flex;
    gap: 5px;
    flex-wrap: nowrap;
  }

  .ai-re-gen-btn {
    font-size: 6.5pt;
    color: #2d3748;
    background: #ffffff;
    border: 1px solid #cbd5e0;
    border-radius: 3px;
    padding: 2px 6px;
    cursor: pointer;
    margin-top: 4px;
    font-weight: 600;
  }

  /* 儀表板數據卡片 UI */
  .dash-card {
    flex: 1;
    border: 1px solid #e2e8f0;
    border-radius: 4px;
    padding: 3px 6px;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .dash-card-title {
    font-size: 6.5pt;
    font-weight: 700;
    color: #718096;
    margin-bottom: 2px;
  }

  .dash-card-value {
    font-size: 7.5pt;
    font-weight: 700;
    color: #1a202c;
    line-height: 1.25;
  }

  @media print {
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    .toolbar, .full-page-mask, .ai-re-gen-btn { display: none !important; }
    .page-container {
      width: 100% !important;
      height: auto !important;
      min-height: 0 !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
    }
  }
</style>

<body>

  <!-- 全頁式 AI 分析遮罩 -->
  <div class="full-page-mask" id="full-page-mask">
    <div class="minimal-glasses">
      <div class="minimal-glasses-lens"></div>
      <div class="minimal-glasses-bridge"></div>
      <div class="minimal-glasses-lens"></div>
    </div>
    <div class="mask-text">[ AI 正在分析今日工作 ... ]</div>
    <div class="mask-subtext">請稍候，大學眼鏡桃園南崁店 工作簡報即時生成中</div>
  </div>

  <!-- 頂部操作列 -->
  <div class="toolbar">
    <div><strong style="color:#1a202c;">大學眼鏡桃園南崁 - 工作簡報</strong> <span style="font-size:8pt; color:#718096; margin-left:6px;">簡報手帳版</span></div>
    <div>
      <button class="btn" onclick="loadAllSheets()">更新資料</button>
      <button class="btn" onclick="window.print()">列印 A4 日報</button>
    </div>
  </div>

  <div class="page-container">

    <!-- 頂部標頭 -->
    <div class="header-box">
      <div class="header-title-date" id="header-date-title">Aug 06, 26 (Thu)</div>
      <div class="header-subtitle">-Kids' daily log - Nankan-</div>
    </div>

    <!-- 上半區：Today's schedule -->
    <div class="section-today">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width: 12%;">Assigned to</th>
            <th style="width: 88%;">Today's schedule</th>
          </tr>
        </thead>
        <tbody id="tb-todays-schedule">
          <tr><td colspan="2" class="center loading">載入中...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 下半區：左右 2 大欄配置 (左 50% / 右 50%) -->
    <div class="bottom-layout">
      <!-- 欄位 1: Next Workday's schedule + 【今日上班人員】底欄 (左 50%) -->
      <div class="bottom-col" style="width: 50%;">
        <div class="bottom-col-title" id="title-next-workday">Next Workday's schedule</div>
        <div class="bottom-col-content" id="col-tomorrows-schedule" style="min-height: 80px;">
          <div class="loading center">載入中...</div>
        </div>

        <!-- 【今日上班人員】簡約底欄 -->
        <div class="staff-roster-bar" id="col-staff-roster">
          <!-- 動態填入班表人員 -->
        </div>
      </div>

      <!-- 欄位 2: Doctor's notice (右 50%) -->
      <div class="bottom-col" style="width: 50%; border-left: none;">
        <div class="bottom-col-title">Doctor's notice</div>
        <div class="bottom-col-content" style="padding: 3px;">
          <div id="col-doctor-notice">
            <div class="loading center">載入中...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 頁尾 本日重點 (管理職視角) -->
    <div class="ai-footer-box">
      <div class="ai-footer-label">
        🎯 本日重點
        <br>
        <button class="ai-re-gen-btn" onclick="generateLocalSummary(latestWorkItems, latestAppointSummaryList, latestLeaveRows)">更新數據</button>
      </div>
      <div class="ai-footer-text" id="ai-summary-text">
        數據彙整中...
      </div>
    </div>

  </div>

<script>
  
  const GIDS = {
    week: '742211352',
    day: '99976034',
    handover: '1323740946',
    logistics: '908822379',
    timeHandover: '2083075445',
    appoint: '988643594',
    roster: '1032350585',
    leave: '700311219'
  };

  let latestWorkItems = [];
  let latestAppointSummaryList = [];
  let latestLeaveRows = [];

  window.gvizCallbacks = {};

  function fetchSheetData(gid) {
    return new Promise((resolve) => {
      const callbackName = 'cb_raw_' + gid;
      let isSettled = false;

      const timer = setTimeout(() => {
        if (!isSettled) {
          isSettled = true;
          resolve([]);
        }
      }, 5000);

      window.gvizCallbacks[callbackName] = function(response) {
        if (!isSettled) {
          isSettled = true;
          clearTimeout(timer);
          if (!response || response.status === 'error' || !response.table) {
            resolve([]);
            return;
          }
          resolve(response.table.rows || []);
        }
      };

      const script = document.createElement('script');
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${gid}&tqx=responseHandler:gvizCallbacks.${callbackName}&t=${new Date().getTime()}`;
      script.onerror = () => {
        if (!isSettled) {
          isSettled = true;
          clearTimeout(timer);
          resolve([]);
        }
      };
      document.body.appendChild(script);
    });
  }

  function parseCellText(cell) {
    if (!cell) return '';
    if (cell.f !== null && cell.f !== undefined && cell.f !== '') {
      return cell.f.toString().trim();
    }
    if (cell.v !== null && cell.v !== undefined) {
      if (typeof cell.v === 'string' && cell.v.startsWith('Date(')) {
        const p = cell.v.match(/\d+/g);
        if (p && p.length >= 3) {
          const y = p[0];
          const m = String(parseInt(p[1], 10) + 1).padStart(2, '0');
          const d = String(p[2]).padStart(2, '0');
          return `${y}/${m}/${d}`;
        }
      }
      return cell.v.toString().trim();
    }
    return '';
  }

  function extractTimeText(cellData) {
    const rawStr = parseCellText(cellData);
    if (!rawStr) return '';
    const match = rawStr.match(/(\d{1,2}:\d{2})(?::\d{2})?/);
    if (match) return match[1];
    return rawStr;
  }

  // 強韌日期比對：支援 YYYY/MM/DD、YYYY-MM-DD、未補零 (2026/9/3) 及 ISO 格式
  function isSameDay(targetDateObj, dateStr) {
    if (!dateStr) return false;
    const clean = String(dateStr).trim().replace('T', ' ').replace(/-/g, '/');
    const datePart = clean.split(' ')[0];
    const parts = datePart.split('/');
    if (parts.length < 3) return false;
    
    const y = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10);
    const d = parseInt(parts[2], 10);
    
    return (
      y === targetDateObj.getFullYear() &&
      m === (targetDateObj.getMonth() + 1) &&
      d === targetDateObj.getDate()
    );
  }

  function checkDateMatch(targetDateObj, cellStr) {
    return isSameDay(targetDateObj, cellStr);
  }

  const todayObj = new Date();
  const year = todayObj.getFullYear();
  const month = todayObj.getMonth();
  const dateNum = todayObj.getDate();
  const dateNumStr = String(dateNum).padStart(2, '0');
  
  const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const zhWeekdaysShort = ['日', '一', '二', '三', '四', '五', '六'];

  const weekdayStr = weekdays[todayObj.getDay()];
  const monthStr = months[month];
  const yearShort = String(year).slice(-2);

  document.getElementById('header-date-title').innerText = `${monthStr} ${dateNumStr}, ${yearShort} (${weekdayStr})`;

  const todayStr = `${year}/${String(month + 1).padStart(2, '0')}/${dateNumStr}`;

  function isToday(str) {
    return checkDateMatch(todayObj, str);
  }

  function getPriorityBadge(priority) {
    if (!priority) return '<span class="badge badge-medium">[中]</span>';
    const p = priority.toString().trim();
    if (p.includes('高') || p.toUpperCase() === 'HIGH' || p === '3') return '<span class="badge badge-high">[高]</span>';
    if (p.includes('低') || p.toUpperCase() === 'LOW' || p === '1') return '<span class="badge badge-medium">[低]</span>';
    return '<span class="badge badge-medium">[中]</span>';
  }

  /* 自動依據班表資料，從明天開始找到下一個全店有上班的營業日 */
  function findNextWorkdayFromSchedules(scheduleList) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    for (let offset = 1; offset <= 30; offset++) {
      const nextDate = new Date(today);
      nextDate.setDate(today.getDate() + offset);

      const y = nextDate.getFullYear();
      const m = String(nextDate.getMonth() + 1).padStart(2, '0');
      const d = String(nextDate.getDate()).padStart(2, '0');
      const dateKeySlash = `${y}/${m}/${d}`;
      const dateKeyDash = `${y}-${m}-${d}`;

      // 檢查該日是否有任一同仁有上班班別
      const hasWorkingStaff = (scheduleList || []).some(s => {
        const sDate = String(s.date || '').trim();
        const isMatchedDate = (sDate === dateKeySlash || sDate === dateKeyDash);
        const isWorking = s.shift_type && s.shift_type.trim() !== '' && s.shift_type.trim() !== '休假';
        return isMatchedDate && isWorking;
      });

      if (hasWorkingStaff) {
        return nextDate; // 找到下一個營業日
      }
    }

    // 若查無資料，預設為明天
    const tomorrow = new Date(today);
    tomorrow.setDate(today.getDate() + 1);
    return tomorrow;
  }

  // ★ 安全防護：Supabase 與 Gemini 金鑰已全數收攏至 Cloudflare Worker
  const API_BASE_URL = "https://dailyreport-security.abc552211.workers.dev";

  /* 自動依據班表，尋找下一個全店有上班的營業日 */
  function findNextWorkday(scheduleList) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    for (let offset = 1; offset <= 30; offset++) {
      const nextDate = new Date(today);
      nextDate.setDate(today.getDate() + offset);

      const y = nextDate.getFullYear();
      const m = String(nextDate.getMonth() + 1).padStart(2, '0');
      const d = String(nextDate.getDate()).padStart(2, '0');
      const dateKeySlash = `${y}/${m}/${d}`;
      const dateKeyDash = `${y}-${m}-${d}`;

      const hasWorkingStaff = (scheduleList || []).some(s => {
        const sDate = String(s.date || '').trim();
        const isMatched = (sDate === dateKeySlash || sDate === dateKeyDash);
        const isWorking = s.shift_type && s.shift_type.trim() !== '' && s.shift_type.trim() !== '休假';
        return isMatched && isWorking;
      });

      if (hasWorkingStaff) return nextDate;
    }

    const defaultNext = new Date(today);
    defaultNext.setDate(today.getDate() + 1);
    return defaultNext;
  }

  async function loadAllSheets() {
    const maskEl = document.getElementById('full-page-mask');
    if (maskEl) {
      maskEl.style.display = 'flex';
      maskEl.style.opacity = '1';
      maskEl.style.visibility = 'visible';
    }

    try {
      const pad = n => String(n).padStart(2, '0');
      const now = new Date();
      const y = now.getFullYear();
      const m = pad(now.getMonth() + 1);
      const d = pad(now.getDate());
      const todaySlash = `${y}/${m}/${d}`;
      const todayDash = `${y}-${m}-${d}`;

      // 1. 透過 Cloudflare Worker 單次安全取得所有簡報數據
      const res = await fetch(`${API_BASE_URL}/api/daily-data?today=${todayDash}`);
      if (!res.ok) throw new Error(`後端讀取失敗 (${res.status})`);
      const { taskData, consultData, handoverData, rosterData, docChanges } = await res.json();

      const zhWeekdays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      const targetZhWeek = zhWeekdays[now.getDay()];

      let todayScheduleList = [];

      // ================= 計算下一個工作日 =================
      const nextWorkdayObj = findNextWorkday(rosterData);
      const nextY = nextWorkdayObj.getFullYear();
      const nextM = pad(nextWorkdayObj.getMonth() + 1);
      const nextD = pad(nextWorkdayObj.getDate());
      const nextSlash = `${nextY}/${nextM}/${nextD}`;
      const nextDash = `${nextY}-${nextM}-${nextD}`;
      const nextDayZh = ['日', '一', '二', '三', '四', '五', '六'][nextWorkdayObj.getDay()];

      // 建立指派人對照 Map
      const assignMap = {};
      (taskData || []).filter(t => t.category === 'assign').forEach(a => {
        if (a.title && a.executor) assignMap[a.title] = a.executor;
      });

      // (A) 週工作：加入今日所有項目，若有指派專人則帶入姓名
      (taskData || []).filter(t => t.category === 'weekly' && t.title === targetZhWeek).forEach(t => {
        const assignKey = `[週] ${t.title}：${t.content}`;
        const executor = assignMap[assignKey] || (t.need_assign ? '未指派' : '全員');
        todayScheduleList.push({
          assigned: executor,
          content: `${getPriorityBadge(t.priority)} ${t.content || ''}`
        });
      });

      // (B) 月工作：加入今日所有項目
      const dateNumStr = `${parseInt(d, 10)}號`;
      (taskData || []).filter(t => t.category === 'monthly' && t.title === dateNumStr).forEach(t => {
        const assignKey = `[月] ${t.title}：${t.content}`;
        const executor = assignMap[assignKey] || (t.need_assign ? '未指派' : '全員');
        todayScheduleList.push({
          assigned: executor,
          content: `${getPriorityBadge(t.priority)} ${t.content || ''}`
        });
      });

      // (C) 今日指定時間交接、追蹤、物流、限時 (使用 isSameDay 與區間比對)
      (handoverData || []).forEach(h => {
        const isTodayTarget = isSameDay(now, h.target_date);
        const isLimited = h.type && h.type.includes('限時');

        if (isLimited && String(h.target_date || '').includes('~')) {
          const parts = String(h.target_date).split('~').map(s => s.trim());
          const startStr = parts[0];
          const endStr = parts[1];
          const startDate = new Date(startStr.replace(/-/g, '/'));
          const endDate = new Date(endStr.replace(/-/g, '/'));

          if (!isNaN(startDate.getTime()) && !isNaN(endDate.getTime())) {
            const todayZero = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const startZero = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate()).getTime();
            const endZero = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate()).getTime();

            if (todayZero === endZero) {
              // 最後一天：像指定時間一樣顯示截止提醒與時間
              const timeMatch = endStr.match(/(\d{1,2}:\d{2})/);
              const endTimeStr = timeMatch ? ` ${timeMatch[1]}` : '';
              todayScheduleList.push({
                assigned: h.to_staff || '全員',
                content: `<span class="badge badge-limited-end">[限時截止]</span> ${h.content || ''}${endTimeStr}`
              });
            } else if (todayZero >= startZero && todayZero < endZero) {
              // 期間內（非最後一天）：像追蹤工作一樣每天顯示
              todayScheduleList.push({
                assigned: h.to_staff || '全員',
                content: `<span class="badge badge-limited">[限時追蹤]</span> ${h.content || ''}`
              });
            }
          }
        } else if (h.type && h.type.includes('指定') && isTodayTarget) {
          todayScheduleList.push({
            assigned: h.to_staff || '全員',
            content: `<span class="badge badge-time">[指定時間]</span> ${h.content || ''}`
          });
        } else if (h.type && h.type.includes('追蹤')) {
          todayScheduleList.push({
            assigned: h.to_staff || '全員',
            content: `<span class="badge badge-track">[追蹤工作]</span> ${h.content || ''}`
          });
        } else if (h.type && h.type.includes('物流')) {
          todayScheduleList.push({
            assigned: h.to_staff || '全員',
            content: `<span class="badge badge-track">[物流]</span> ${h.content || ''}`
          });
        }
      });

      // (D) 今日諮詢預約
      let appointSummaryList = [];
      (consultData || []).forEach(c => {
        const aTime = String(c.appoint_time || '').trim();
        const isTodayAppoint = (c.is_appoint === '是' && (aTime.startsWith(todayDash) || aTime.startsWith(todaySlash)));

        if (isTodayAppoint) {
          const clientName = c.name || '';
          const phone = c.phone ? ` (${c.phone})` : '';
          const eventContent = c.event || '';
          const timeStr = aTime.includes('T') ? aTime.split('T')[1].substring(0, 5) : aTime.substring(11, 16);

          todayScheduleList.push({
            assigned: c.staff || '全員',
            content: `<span class="badge badge-appoint">[預約]</span> ${clientName}${phone}：${eventContent} ${timeStr}`
          });

          if (clientName) appointSummaryList.push(`${clientName}(${eventContent} ${timeStr})`);
        }
      });

      // docGroupMap 結構: { 醫師姓名: { "M/D": [ "早診(請)", "午診(換)林醫師" ] } }
      const docGroupMap = {};
      let hasDocLeaveToday = false;
      let nextWorkdayDocItems = [];

      (docChanges || []).forEach(r => {
        // 排除已取消的異動
        if (r.type === '取消異動') return;

        const docName = r.old_staff || '醫師';
        const rawDate = r.date || '';
        const dateParts = rawDate.split('-');
        const dateShort = `${parseInt(dateParts[1], 10)}/${parseInt(dateParts[2], 10)}`;
        const shiftShort = (r.shift || '').replace('班', '診');

        // 產生變更描述：如 (換)林醫師 或 (請)
        let changeDesc = `(${r.type})`;
        if (r.type === '換班' && r.new_staff && r.new_staff !== r.old_staff) {
          changeDesc = `(換)${r.new_staff}`;
        } else if (r.type === '請假') {
          changeDesc = `(請)`;
        } else if (r.type === '僅輸入備註') {
          changeDesc = r.note ? `(${r.note})` : `(備註)`;
        }

        // 1. 若為「當日」異動 -> 顯示在 Today's schedule 頂部
        if (rawDate === todayDash || rawDate === todaySlash) {
          hasDocLeaveToday = true;
          todayScheduleList.unshift({
            assigned: '醫師公告',
            content: `<span class="badge badge-doc">[醫師異動]</span> ${docName}醫師：${shiftShort} ${changeDesc}`
          });
        }

        // 2. 若為「下一個工作日」異動 -> 收集準備合併顯示在 Next Workday's schedule 內
        if (rawDate === nextDash || rawDate === nextSlash) {
          nextWorkdayDocItems.push(`<span class="badge badge-doc">[醫師異動]</span> ${docName}醫師：${shiftShort} ${changeDesc}`);
        }

        // 3. 醫師請假 notice 內：先分醫師，裡面再分日期
        if (!docGroupMap[docName]) {
          docGroupMap[docName] = {};
        }
        if (!docGroupMap[docName][dateShort]) {
          docGroupMap[docName][dateShort] = [];
        }
        docGroupMap[docName][dateShort].push(`${shiftShort}${changeDesc}`);
      });

      let docNoticeHtml = '';
      const docNames = Object.keys(docGroupMap);

      if (docNames.length > 0) {
        docNames.forEach(name => {
          const dateMap = docGroupMap[name];
          let dateItemsHtml = '';
          
          Object.keys(dateMap).forEach(dShort => {
            const shiftsStr = dateMap[dShort].join('、');
            dateItemsHtml += `
              <div class="doc-date-group">
                <span class="doc-date-tag">📅 ${dShort}：</span>${shiftsStr}
              </div>
            `;
          });

          docNoticeHtml += `
            <div class="doc-card">
              <div class="doc-name-title">👨‍⚕️ ${name} 醫師異動：</div>
              <div class="doc-dates-text-grid">${dateItemsHtml}</div>
            </div>
          `;
        });
      } else {
        docNoticeHtml = '<div class="center" style="color:#a0aec0; margin-top:10px;">-無醫師請假資料-</div>';
      }

      // 渲染到右側 Doctor's notice 欄位
      document.getElementById('col-doctor-notice').innerHTML = docNoticeHtml;
      // ==============================================================================================

      // 依重要性優先度排序：高 > 中 > 低 (其他項目次之，但醫師異動優先保留在最前)
      const getPriorityWeight = (contentStr) => {
        if (!contentStr) return 5;
        if (contentStr.includes('badge-doc') || contentStr.includes('[醫師異動]')) return 0;
        if (contentStr.includes('badge-high') || contentStr.includes('[高]')) return 1;
        if (contentStr.includes('[中]')) return 2;
        if (contentStr.includes('[低]')) return 3;
        return 4;
      };

      todayScheduleList.sort((a, b) => {
        const weightA = getPriorityWeight(a.content);
        const weightB = getPriorityWeight(b.content);
        return weightA - weightB;
      });

      // 渲染主表格
      const tbSchedule = document.getElementById('tb-todays-schedule');
      let scheduleHtml = '';
      if (todayScheduleList.length > 0) {
        scheduleHtml += todayScheduleList.map(item => `
          <tr>
            <td class="center" style="font-weight: 600;">${item.assigned}</td>
            <td>${item.content}</td>
          </tr>
        `).join('');
      }

      const emptyCount = Math.max(2, 14 - todayScheduleList.length);
      for (let i = 0; i < emptyCount; i++) {
        scheduleHtml += `<tr><td class="center">&nbsp;</td><td>&nbsp;</td></tr>`;
      }
      tbSchedule.innerHTML = scheduleHtml;

      // ================= 次營業日日程渲染 =================
      const titleNextEl = document.getElementById('title-next-workday');
      if (titleNextEl) {
        titleNextEl.innerText = `Next Workday Schedule (${parseInt(nextM,10)}/${parseInt(nextD,10)} ${nextDayZh})`;
      }

      let nextWorkdayItems = [];

      // 0. 次營業日：醫師異動 (置頂)
      if (nextWorkdayDocItems.length > 0) {
        nextWorkdayItems.push(...nextWorkdayDocItems);
      }

      // 1. 次營業日：指定時間交接與限時截止日 (使用 isSameDay 精準抓取)
      (handoverData || []).forEach(h => {
        if (h.type && h.type.includes('指定') && isSameDay(nextWorkdayObj, h.target_date)) {
          nextWorkdayItems.push(`<span class="badge badge-time">[指定時間]</span> ${h.content || ''}`);
        } else if (h.type && h.type.includes('限時') && String(h.target_date || '').includes('~')) {
          const parts = String(h.target_date).split('~').map(s => s.trim());
          const endStr = parts[1];
          if (isSameDay(nextWorkdayObj, endStr)) {
            const timeMatch = endStr.match(/(\d{1,2}:\d{2})/);
            const endTimeStr = timeMatch ? ` ${timeMatch[1]}` : '';
            nextWorkdayItems.push(`<span class="badge badge-limited-end">[限時截止]</span> ${h.content || ''}${endTimeStr}`);
          }
        }
      });

      // 2. 次營業日：諮詢預約
      (consultData || []).forEach(c => {
        const aTime = String(c.appoint_time || '').trim();
        if (c.is_appoint === '是' && (aTime.startsWith(nextDash) || aTime.startsWith(nextSlash))) {
          const clientName = c.name || '';
          const phone = c.phone ? ` (${c.phone})` : '';
          const eventContent = c.event || '';
          const timeStr = aTime.includes('T') ? aTime.split('T')[1].substring(0, 5) : aTime.substring(11, 16);
          nextWorkdayItems.push(`<span class="badge badge-appoint">[預約]</span> ${clientName}${phone}：${eventContent} ${timeStr}`);
        }
      });

      const colTomorrow = document.getElementById('col-tomorrows-schedule');
      if (colTomorrow) {
        if (nextWorkdayItems.length > 0) {
          colTomorrow.innerHTML = nextWorkdayItems.map(item => `<div style="margin-bottom:3px;">• ${item}</div>`).join('');
        } else {
          colTomorrow.innerHTML = '<div class="center" style="color:#a0aec0; padding: 15px 0;">-無預約與交接事項-</div>';
        }
      }

      // 今日出勤班表單列
      const todayRoster = (rosterData || []).filter(s => {
        const sDate = String(s.date || '').trim();
        return (sDate === todaySlash || sDate === todayDash) && s.shift_type && s.shift_type !== '休假';
      });

      const colRoster = document.getElementById('col-staff-roster');
      if (colRoster) {
        if (todayRoster.length > 0) {
          const rosterBadges = todayRoster.map(s => `<span class="staff-inline-item"><strong>${s.staff_name}</strong>(${s.shift_type})</span>`).join('');
          colRoster.innerHTML = `<span class="staff-title">【今日上班人員】</span>` + rosterBadges;
        } else {
          colRoster.innerHTML = `<span class="staff-title">【今日上班人員】</span><span style="color:#a0aec0;">本日無排班紀錄</span>`;
        }
      }

      latestWorkItems = todayScheduleList;
      latestAppointSummaryList = appointSummaryList;
      latestLeaveRows = hasDocLeaveToday ? [{ c: [{ v: todayDash }] }] : [];

      generateLocalSummary(todayScheduleList, appointSummaryList, latestLeaveRows);
    } catch (err) {
      console.error("日報載入失敗:", err);
    } finally {
      if (maskEl) {
        maskEl.style.opacity = '0';
        setTimeout(() => {
          maskEl.style.visibility = 'hidden';
          maskEl.style.display = 'none';
        }, 400);
      }
    }
  }

  // 🌟 管理職視角：本日重點數據儀表板
  function generateLocalSummary(workItems, appointSummaryList, leaveRows) {
    const summaryEl = document.getElementById('ai-summary-text');
    
    // 1. 統計工作項目
    let highPriorityCount = 0;
    let trackCount = 0;
    let logisticsCount = 0;
    
    workItems.forEach(item => {
      const content = item.content || '';
      if (content.includes('badge-high') || content.includes('[限時截止]')) highPriorityCount++;
      if (content.includes('[追蹤工作]') || content.includes('[限時追蹤]')) trackCount++;
      if (content.includes('[物流]')) logisticsCount++;
    });

    // 2. 統計預約數量
    const todayAppointCount = appointSummaryList.length;

    // 3. 檢查今日是否有醫師請假
    let docLeaveToday = (leaveRows && leaveRows.length > 0);

    // 4. 統計次工作日預約 (從畫面已產生的內容中抓取)
    const colTomorrowHtml = document.getElementById('col-tomorrows-schedule').innerHTML;
    const nextDayAppointCount = (colTomorrowHtml.match(/\[預約\]/g) || []).length;

    // 5. 組裝管理職數據儀表板 (四區塊獨立卡片)
    
    // 卡片一：醫師/人力狀況 (紅燈/綠燈管理)
    const hrBg = docLeaveToday ? 'background-color:#fff5f5; border-color:#feb2b2;' : 'background-color:#f0fff4; border-color:#9ae6b4;';
    const hrText = docLeaveToday ? '<span style="color:#c53030;">⚠️ 異動請假</span>' : '<span style="color:#276749;">✅ 出勤正常</span>';
    
    // 卡片二：優先急件狀況 (橘燈警示)
    const priBg = highPriorityCount > 0 ? 'background-color:#fffaf0; border-color:#fbd38d;' : '';
    const priText = highPriorityCount > 0 ? `<span style="color:#dd6b20;">🚨 ${highPriorityCount} 筆待辦</span>` : '<span style="color:#a0aec0;">無急件</span>';

    // 卡片三：今日常規營運
    const opsText = `預約 <span style="color:#3182ce; font-size:8.5pt;">${todayAppointCount}</span> ｜ 追蹤 <span style="color:#3182ce; font-size:8.5pt;">${trackCount}</span> ｜ 物流 <span style="color:#3182ce; font-size:8.5pt;">${logisticsCount}</span>`;

    // 卡片四：次日準備 (紫燈提示)
    const prepBg = nextDayAppointCount > 0 ? 'background-color:#faf5ff; border-color:#e9d8fd;' : '';
    const prepText = nextDayAppointCount > 0 ? `💬 提醒簡訊 <span style="color:#805ad5; font-size:8.5pt;">${nextDayAppointCount} 筆</span>` : '<span style="color:#a0aec0;">無預約</span>';

    // 注入新排版 HTML
    summaryEl.innerHTML = `
      <div class="dash-card" style="${hrBg}">
        <div class="dash-card-title">醫師</div>
        <div class="dash-card-value">${hrText}</div>
      </div>
      <div class="dash-card" style="${priBg}">
        <div class="dash-card-title">優先急件</div>
        <div class="dash-card-value">${priText}</div>
      </div>
      <div class="dash-card" style="flex: 1.5; background-color:#ebf8ff; border-color:#bee3f8;">
        <div class="dash-card-title">今日營運任務</div>
        <div class="dash-card-value">${opsText}</div>
      </div>
      <div class="dash-card" style="${prepBg}">
        <div class="dash-card-title">次日準備</div>
        <div class="dash-card-value">${prepText}</div>
      </div>
    `;
  }

  window.onload = loadAllSheets;
</script>
</body>
</html>
